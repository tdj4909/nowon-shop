[phases.build]
# --no-daemon: 빌드는 일회성이므로 데몬을 띄울 이유가 없다.
# 데몬이 남아 있으면 빌드가 끝난 뒤에도 힙을 점유해 빌더 메모리를 낭비한다.
cmds = ["./gradlew bootJar -x test --no-daemon"]

[start]
# 실측 기준(jcmd VM.metaspace / VM.native_memory), 요청을 처리시킨 뒤의 값:
#   전체 committed  268MB
#   힙              85MB
#   metaspace       97MB   (기동 직후 86MB → 요청 4건 처리 후 97MB)
#   code            27MB
#
# -Xms64m -Xmx256m (비율이 아닌 절대값)
#   MaxRAMPercentage 계열은 JVM이 cgroup 한도를 정확히 읽는다는 전제에 의존한다.
#   컨테이너 힌트 없이 측정했을 때 JVM이 호스트 메모리 기준으로 초기 힙 222MB를
#   즉시 커밋했다. -Xmx만으로는 막히지 않는다(초기 힙은 -Xms가 정한다).
# -XX:+UseSerialGC
#   G1은 최대 힙에 비례해 부기용 네이티브 메모리를 잡는다. 실측 55MB였던 것이
#   SerialGC에서 0.3MB가 됐다. 코어가 적은 컨테이너에서는 G1의 이점도 거의 없다.
# -XX:MaxMetaspaceSize=256m
#   상한을 너무 낮게 잡으면 컨테이너 한도와 무관하게 JVM이 스스로 죽는다.
#   실제로 96m으로 잡았다가 첫 요청에서 OutOfMemoryError: Metaspace로 종료됐다.
#   metaspace는 기동만으로 이미 86MB를 쓰고 트래픽에 따라 더 자란다.
#   실측 97MB에 2.5배 여유를 둔 값이며, 상한일 뿐 미리 커밋되지는 않는다.
# -XX:+ExitOnOutOfMemoryError
#   힙 OOM 이후의 JVM은 상태를 신뢰할 수 없다. 즉시 종료해 Railway가 재시작하게 한다.
#
# 의도적으로 넣지 않은 것:
#   -Xss  스레드 스택을 줄여도 실측 절감이 1MB 남짓인데 StackOverflowError 위험만 는다.
#   -XX:ReservedCodeCacheSize  예약(가상 주소)만 줄일 뿐 RSS는 그대로다. 효과가 없다.
cmd = "java -Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=256m -XX:+ExitOnOutOfMemoryError -jar build/libs/shop-0.0.1-SNAPSHOT.jar"
